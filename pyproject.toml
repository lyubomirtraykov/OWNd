[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Default E/F plus the bug-hunting families:
# B  = bugbear (real-bug patterns)     ASYNC = blocking I/O in async code
# SIM = simplifications                UP    = outdated syntax
# RET = inconsistent returns           PLE/PLW = pylint errors/warnings
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "SIM", "UP", "RET", "PLE", "PLW"]

[tool.mypy]
python_version = "3.14"
# The code base is progressively typed: check what is annotated, do not
# force annotations everywhere (yet).
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
